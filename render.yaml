services:
  - type: web
    name: wecare-services
    runtime: python
    pythonVersion: 3.12.12
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wecare-db
          property: connectionString

databases:
  - name: wecare-db
    postgresMajorVersion: '18'
    plan: basic-256mb
